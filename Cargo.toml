[package]
name = "caravan"
version = "0.1.0"
edition = "2021"
description = "Conservative two-phase migration CLI for Windows staging and Linux Btrfs migration"
license = "MIT"

[dependencies]
blake3 = "1.8.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
mockall = "0.13"